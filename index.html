    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!--
      Free fallbacks for the real Persona 3/4 faces (see tailwind.config.js):
      Arsenal stands in for FOT-Chiaro Std B, Zen Kaku Gothic New for
      FOT-Skip Std B. Both are SIL OFL, so they ship safely to any visitor.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      To serve the real FOT-Chiaro Std: activate it at
      https://fonts.adobe.com/fonts/fot-chiaro-std (web use is included with a
      Creative Cloud plan), then uncomment the link below with your own kit id.
      The font stacks already name it first, so nothing else needs to change.
    -->
    <!-- <link rel="stylesheet" href="https://use.typekit.net/YOUR_KIT_ID.css" /> -->
    <title>Portfolio</title>
  </head>

    <div id="root"></div>
