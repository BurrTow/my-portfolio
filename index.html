<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E10" />
    <!--
      Theme before first paint, so a light-mode visitor never sees a dark frame.
      Same key and colours as src/store/useThemeStore.ts. Storage can throw
      (private window, blocked site data); that falls through to the OS
      preference, and dark unless the OS explicitly asks for light.
    -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem("portfolio:theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "light" ? "#F3F7FA" : "#0E0E10");
      })();
    </script>
    <meta
      name="description"
      content="Personal portfolio — Persona 3 Reload-styled menu interface."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Free fallbacks for the real Persona 3/4 faces (see tailwind.config.js):
      Arsenal stands in for FOT-Chiaro Std B, Zen Kaku Gothic New for
      FOT-Skip Std B. Both are SIL OFL, so they ship safely to any visitor.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      To serve the real FOT-Chiaro Std: activate it at
      https://fonts.adobe.com/fonts/fot-chiaro-std (web use is included with a
      Creative Cloud plan), then uncomment the link below with your own kit id.
      The font stacks already name it first, so nothing else needs to change.
    -->
    <!-- <link rel="stylesheet" href="https://use.typekit.net/YOUR_KIT_ID.css" /> -->
    <title>Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
